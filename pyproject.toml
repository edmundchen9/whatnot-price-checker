[build-system]
requires = ["setuptools>=61"]
build-backend = "setuptools.build_meta"

[project]
name = "whatnot-price-checker"
version = "0.1.0"
description = "Screen capture + Pokemon card hint overlay with TCGPlayer price lookup"
requires-python = ">=3.10"
dependencies = [
    "mss>=9.0.0",
    "numpy>=1.24.0",
    "opencv-python-headless>=4.8.0",
    "PySide6>=6.6.0",
    "pywin32>=306; sys_platform == 'win32'",
    "httpx>=0.27.0",
    "python-dotenv>=1.0.0",
]

[project.optional-dependencies]
ocr = [
    "easyocr>=1.7.0",
]

[project.scripts]
whatnot-price-checker = "whatnot_price_checker.__main__:main"

[tool.setuptools.packages.find]
where = ["src"]
